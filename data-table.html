<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物件儲存管理系統</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- 頂部標題欄 -->
        <header class="app-header">
            <h1>📦 物件儲存管理系統</h1>
            <!-- 統計信息 -->
            <div class="header-stats">
                <div class="header-stat-item">
                    <span class="header-stat-icon">🏠</span>
                    <span class="header-stat-number" id="headerTotalRoots">0</span>
                    <span class="header-stat-label">地點</span>
                </div>
                <div class="header-stat-item">
                    <span class="header-stat-icon">📦</span>
                    <span class="header-stat-number" id="headerTotalNodes">0</span>
                    <span class="header-stat-label">容器</span>
                </div>
                <div class="header-stat-item">
                    <span class="header-stat-icon">🔖</span>
                    <span class="header-stat-number" id="headerTotalLeafs">0</span>
                    <span class="header-stat-label">物件</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-icon" onclick="exportToJSON()">💾 導出</button>
                <button class="btn btn-icon" onclick="document.getElementById('importFile').click()">📂 導入</button>
                <button class="btn btn-icon" onclick="restoreTemplate()">🔄 還原範本</button>
                <button class="btn btn-icon btn-danger" onclick="clearAllData()">🗑️ 清空</button>
            </div>
            <input type="file" id="importFile" accept=".json" onchange="importData(event)" style="display: none;">

            <div class="mobile-header-toggle" id="mobileHeaderToggle" onclick="toggleMobileHeader()">
                <span id="headerToggleIcon">▲</span>
            </div>
        </header>

        <!-- 主要內容區 -->
        <div class="main-content">
            <!-- 左側：地點列表 -->
            <div class="left-panel">
                <!-- 統計卡片已移到 header 中 -->
                <div class="stats-bar" style="display: none;">
                    <div class="stat-item">
                        <div class="stat-icon">🏠</div>
                        <div class="stat-info">
                            <div class="stat-number" id="totalRoots">0</div>
                            <div class="stat-label">地點</div>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-icon">📦</div>
                        <div class="stat-info">
                            <div class="stat-number" id="totalNodes">0</div>
                            <div class="stat-label">容器</div>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-icon">🔖</div>
                        <div class="stat-info">
                            <div class="stat-number" id="totalLeafs">0</div>
                            <div class="stat-label">物件</div>
                        </div>
                    </div>
                </div>

                <!-- 搜索欄 -->
                <div class="search-bar">
                    <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索地點、容器或物件..." oninput="filterLocations(this.value)">
                </div>

                <!-- 面板横向容器 -->
                <div class="panels-row">
                    <!-- 地點列表 -->
                    <div class="tree-panel">
                        <div class="tree-header">
                            <h3>🏠 地點列表</h3>
                            <button class="btn-add-location" onclick="addNewLocation()">+ 新增地點</button>
                        </div>

                        <div class="locations-list" id="locationsList">
                            <!-- 地點卡片將動態插入 -->
                        </div>
                    </div>

                    <!-- 臨時存儲面板 -->
                    <div class="temp-storage-container" id="tempStorageContainer">
                        <div class="temp-storage-header">
                            <h3>📋 臨時存儲</h3>
                            <button class="btn-toggle-temp" id="toggleTempBtn" onclick="toggleTempStorage()" title="隱藏/顯示臨時存儲">▼</button>
                        </div>
                        <div class="temp-storage-content" id="tempStorageList">
                            <!-- 臨時項目將動態插入 -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右側：數據輸入表單 -->
            <div class="right-panel">
                <div class="form-container">
                    <!-- 標籤頁切換 -->
                    <div class="tab-header">
                        <button class="tab-button active" onclick="switchTab('form')" id="formTab">➕ 添加項目</button>
                        <button class="tab-button" onclick="switchTab('hierarchy')" id="hierarchyTab">🌲 層級構建</button>
                    </div>

                    <!-- 表單標籤頁 -->
                    <div id="formTabContent" class="tab-content active">
                    <!-- 編輯提示 -->
                    <div class="edit-mode-banner" id="editBanner" style="display: none;">
                        <span id="editBannerText">✏️ 正在編輯</span>
                        <button class="btn-close" onclick="cancelEdit()">✕</button>
                    </div>

                    <form class="vertical-form" id="dataForm" onsubmit="saveData(event)">
                        <div class="form-group">
                            <label for="itemType">類型 *</label>
                            <select id="itemType" class="form-input" required onchange="updateFormFields()">
                                <option value="">請選擇...</option>
                                <option value="root">🏠 地點 (Root)</option>
                                <option value="node">📦 容器 (Node)</option>
                                <option value="leaf">🔖 物件 (Leaf)</option>
                            </select>
                        </div>

                        <div class="form-group" id="parentField">
                            <label for="parentInputField">父級 *</label>
                            <div class="parent-input-wrapper">
                                <input type="text" id="parentInputField" class="form-input" placeholder="選擇或輸入新的父級..." oninput="handleParentInputChange()">
                                <div class="parent-suggestions" id="parentSuggestions"></div>
                            </div>
                            <input type="hidden" id="parentId" value="">
                            <div class="form-hint" id="parentHint">Node 或 Leaf 需要選擇父級</div>
                        </div>

                        <div class="form-group" id="filterLocationField" style="display: none;">
                            <label for="filterLocationId">限制地點</label>
                            <select id="filterLocationId" class="form-input" onchange="updateFormFields()">
                                <option value="">所有地點</option>
                            </select>
                            <div class="form-hint">選擇地點以篩選容器選項</div>
                        </div>

                        <div class="form-group" id="nameField" style="display: none;">
                            <label for="itemName">名稱 *</label>
                            <input type="text" id="itemName" class="form-input" placeholder="例如: 睡房、衣櫃、睡衣">
                        </div>

                        <div class="form-group" id="contentField" style="display: none;">
                            <label>名稱 *</label>
                            <div class="tags-input-wrapper" id="contentsWrapper">
                                <div class="tags-container" id="contentsContainer" onclick="document.getElementById('contentInput').focus()">
                                    <input type="text" id="contentInput" class="tag-input-field" placeholder="輸入名稱搜索或創建..." autocomplete="off">
                                </div>
                                <div class="tags-suggestions" id="contentSuggestions"></div>
                            </div>
                        </div>

                        <div class="form-group" id="quantityField" style="display: none;">
                            <label for="itemQuantity">數量</label>
                            <input type="number" id="itemQuantity" class="form-input" placeholder="1" min="1" value="1">
                        </div>

                        <div class="form-group">
                            <label for="description">描述</label>
                            <textarea id="description" class="form-input form-textarea" rows="3" placeholder="選填..."></textarea>
                        </div>

                        <div class="form-group">
                            <label>標籤</label>
                            <div class="tags-input-wrapper" id="tagsWrapper">
                                <div class="tags-container" id="tagsContainer" onclick="document.getElementById('tagInput').focus()">
                                    <input type="text" id="tagInput" class="tag-input-field" placeholder="輸入標籤..." autocomplete="off">
                                </div>
                                <div class="tags-suggestions" id="tagsSuggestions"></div>
                            </div>
                            <!-- 隱藏的原始輸入框，用於兼容舊代碼引用，雖然我們會修改邏輯不使用它，但保留ID以防萬一 -->
                            <input type="hidden" id="tags">
                        </div>

                        <input type="hidden" id="editId">
                        <input type="hidden" id="editType">
                    </form>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-large" onclick="document.getElementById('dataForm').dispatchEvent(new Event('submit'))">
                            💾 保存項目
                        </button>
                        <button type="button" class="btn-reset" onclick="resetForm()" style="margin-left: 10px;">
                            🔄 重置
                        </button>
                    </div>
                    </div>

                    <!-- 層級構建標籤頁 -->
                    <div id="hierarchyTabContent" class="tab-content">
                        <div class="hierarchy-builder">
                            <div id="hierarchyLevels" class="hierarchy-levels">
                                <!-- 層級選擇框將在這裡動態生成 -->
                            </div>

                            <div class="hierarchy-actions">
                                <button class="btn btn-primary btn-large" onclick="saveHierarchy()">
                                    💾 保存結構
                                </button>
                                <button type="button" class="btn-reset" onclick="resetHierarchy()" style="margin-left: 10px;">
                                    🔄 重置
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Bottom Navigation -->
    <div class="mobile-bottom-nav">
        <div class="nav-item active" id="nav-list" onclick="switchMobileView('list')">
            <span class="nav-icon">📋</span>
            <span class="nav-label">列表</span>
        </div>
        <div class="nav-item" id="nav-add" onclick="switchMobileView('add')">
            <span class="nav-icon">➕</span>
            <span class="nav-label">添加</span>
        </div>
        <div class="nav-item" id="nav-temp" onclick="switchMobileView('temp')">
            <span class="nav-icon">📦</span>
            <span class="nav-label">暫存</span>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="js/core.js"></script>
    <script src="js/ui-mobile.js"></script>
    <script src="js/ui-desktop.js"></script>
</body>
</html>
